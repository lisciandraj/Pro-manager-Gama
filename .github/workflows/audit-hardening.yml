name: Audit hardening regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.3
      - run: npm ci
      - run: npm run build && npm run build:storefront
      - run: node --test --test-concurrency=2 tests/audit-security-gates-db.test.cjs tests/coco-agent-db.test.cjs tests/offline-vault.test.cjs tests/storefront-photos.test.cjs tests/storefront-progressive.test.cjs tests/notification-polling.test.cjs tests/performance-metrics.test.cjs tests/migration-preflight.test.cjs tests/audit-csv.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/tms-module.spec.js tests/coco-agent-ui.spec.js tests/storefront.spec.js tests/b2b-portal.spec.js tests/notifications-window.spec.js tests/loading-performance.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-hardening-results
          path: test-results/
          retention-days: 7
