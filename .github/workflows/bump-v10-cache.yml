name: Bump V10 cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump service worker cache
        run: |
          sed -i "s/gama-stock-v10-1/gama-stock-v10-2/g" sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js
          if git diff --cached --quiet; then echo 'Cache already current'; else git commit -m 'Bump V10 service worker cache'; git push; fi
