name: Install final phone scanner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy inline scanner and version final scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="gama-scanner-phone\.js\?v=[^"]+"></script>\s*<script>\s*\(\(\)=>\{\s*[\'\"]use strict[\'\"];\s*const STYLE=[\'\"]gamaScannerV4Style[\'\"];.*?</script>', '<script src="gama-scanner-phone.js?v=6"></script>', s, flags=re.S)
          s=s.replace('gama-scanner-phone.js?v=4','gama-scanner-phone.js?v=6')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'gama-scanner-phone.js?v=6' index.html
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use final scanner without legacy inline handler'
          git push