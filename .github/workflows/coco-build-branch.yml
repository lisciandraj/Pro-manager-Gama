name: Prepare Coco maintenance outputs
on:
  push:
    branches: [codex/coco-maintenance-20260930]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/coco-maintenance-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated outputs on the maintenance branch
        run: |
          node -e "const {generated}=require('./scripts/lib/assets.cjs');require('node:child_process').execFileSync('git',['add','--',...generated,'gama-i18n-catalog.js','index.html','gama-site.html','camera-check.html','architect-core.js','architect-components.css','architect-base.css','architect-assets.js','sw.js'])"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: regenerate Coco compatible assets'
            git push origin HEAD:codex/coco-maintenance-20260930
          fi
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/pdf-on-demand.spec.js tests/loading-performance.spec.js tests/performance-guard.spec.js tests/company-settings.spec.js tests/quote-flow.spec.js tests/purchase-order.spec.js tests/pdf-download.spec.js tests/internal-invoices.spec.js tests/client-quotes.spec.js tests/project-management.spec.js tests/tms-module.spec.js tests/i18n-coverage.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coco-maintenance-traces
          path: test-results/
