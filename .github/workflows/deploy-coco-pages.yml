name: Build and publish Coco ERP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coco-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  business-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/business-modules-db.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/business-modules.spec.js tests/module-header.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-module-test-results
          path: test-results
          retention-days: 7
  topbar-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run check:startup
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify square home tiles in Chromium and WebKit before publication
        run: npx playwright test --config=playwright.responsive.config.js tests/responsive-layout.spec.js --grep "home tiles stay square" --workers=2
      - name: Verify top bar subsection menus and existing window flows
        run: npx playwright test tests/settings-window.spec.js tests/notifications-window.spec.js tests/architect-shell.spec.js tests/i18n.spec.js tests/operations.spec.js tests/excel-import.spec.js tests/invitation-email.spec.js tests/responsive-forms.spec.js tests/tab-labels.spec.js tests/users-screen.spec.js tests/photo-import.spec.js tests/egress-photos.spec.js tests/product-identity.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coco-topbar-interface-results
          path: test-results/
          retention-days: 3
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.3
      - run: npm ci
      - run: npm run update
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/coco-agent-ui.spec.js tests/agent-queue.spec.js tests/assistant-ia.spec.js tests/accounting.spec.js tests/accounting-audit.spec.js --workers=2
      - name: Verify dispatcher and offline driver workflows
        run: npx playwright test tests/tms-dispatch.spec.js tests/tms-module.spec.js tests/tms-loading.spec.js tests/tms-pro.spec.js --workers=2
      - name: Verify module and dossier history, process references and links on desktop and phone
        run: npx playwright test tests/order-followup.spec.js tests/order-followup-grouping.spec.js tests/module-history.spec.js tests/history-context.spec.js tests/purchase-order-email.spec.js tests/dossier-flow.spec.js tests/dossier-references.spec.js --workers=2
      - name: Preserve history context screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coco-history-context-results
          path: |
            test-results/history-context*
            test-results/history-pending*
          retention-days: 3
      - name: Verify sign-in errors, profile deadlines and access recovery
        run: npx playwright test tests/login-recovery.spec.js tests/auth-single-source.spec.js tests/loading-performance.spec.js tests/cloud-customer-accounts.spec.js --workers=2
      - name: Verify deployed server without business credentials
        run: node scripts/check-agent-live.mjs
      - name: Stamp the exact source revision
        run: node -e "require('node:fs').writeFileSync('dist/coco-build.json',JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,built_at:new Date().toISOString()}))"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coco-publish-interface-results
          path: test-results/
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, topbar-menus, business-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the owner-selected GitHub Actions publication source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Cannot read GitHub Pages configuration; check repository Pages permissions.');
          const site=await r.json();
          if(site.build_type!=='workflow')throw Error('Owner action required: repository Settings > Pages > Build and deployment > Source = GitHub Actions. Then rerun this workflow. No repository administration setting has been changed automatically.');
          JS
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the revision and sales assets served by Pages
        env:
          COCO_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          const base=new URL(process.env.COCO_PAGES_URL);
          if(base.protocol!=='https:')throw Error('Expected HTTPS Pages URL');
          const read=async path=>{
            const url=new URL(path,base);
            const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error(url.pathname+' returned '+response.status);
            return response.text();
          };
          let last;
          for(let attempt=0;attempt<12;attempt++){
            try{
              const marker=JSON.parse(await read('coco-build.json?verification='+process.env.GITHUB_RUN_ID+'-'+attempt));
              if(marker.commit!==process.env.GITHUB_SHA)throw Error('Served revision '+marker.commit+' differs from '+process.env.GITHUB_SHA);
              const html=await read('./?verification='+process.env.GITHUB_RUN_ID);
              const assetFile=html.match(/src=["']([^"']*architect-assets\.js[^"']*)["']/)?.[1];
              if(!assetFile)throw Error('Asset manifest missing from served page');
              const assets=await read(assetFile);
              for(const file of ['coco-sales-catalog.js','coco-sales-catalog.css','coco-sales-commitments.js']){
                const key=file.replaceAll('.','\\.');
                const versioned=assets.match(new RegExp('["\\x27]'+key+'["\\x27]\\s*:\\s*["\\x27]([^"\\x27]+)["\\x27]'))?.[1];
                if(!versioned)throw Error(file+' missing from served asset manifest');
                const body=await read(versioned);
                if(!body.includes(file==='coco-sales-commitments.js'?'CocoSalesCommitments':file.endsWith('.js')?'CocoSalesCatalog':'cocoQuoteCatalog'))throw Error('Unexpected served catalog asset');
              }
              console.log('Verified Pages commit '+marker.commit+' at '+base.href+'; catalog and distribution planning assets served successfully.');
              process.exit(0);
            }catch(error){last=error;console.log('Publication verification attempt '+(attempt+1)+': '+error.message);}
            if(attempt<11)await delay(10000);
          }
          throw last;
          JS
