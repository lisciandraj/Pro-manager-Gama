name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          test -f gama-menu-final2.js
          test -f gama-tms-module.js
          test -f gama-standard-ui.js
          test -f gama-fixed-header.js
          test -f gama-role-spanish.js
          test -f gama-access-control.js
          node --check gama-menu-final2.js
          node --check gama-tms-module.js
          node --check gama-standard-ui.js
          node --check gama-fixed-header.js
          node --check gama-role-spanish.js
          node --check gama-access-control.js
      - name: Refresh cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          versions={
            'gama-standard-ui.js':'10',
            'gama-menu-final2.js':'8',
            'gama-role-spanish.js':'8',
            'gama-fixed-header.js':'8',
            'gama-access-control.js':'2'
          }
          for name,version in versions.items():
              s=re.sub(rf'{re.escape(name)}\\?v=[^"\\']+',f'{name}?v={version}',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate cache versions
        run: |
          grep -q 'gama-standard-ui.js?v=10' index.html
          grep -q 'gama-menu-final2.js?v=8' index.html
          grep -q 'gama-role-spanish.js?v=8' index.html
          grep -q 'gama-fixed-header.js?v=8' index.html
          grep -q 'gama-access-control.js?v=2' index.html
      - name: Commit deployment references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh stable shell loaders'
          git push origin HEAD:main
