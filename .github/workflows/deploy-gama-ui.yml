name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          grep -q '</html>' index.html
          grep -q 'id="pBarcode"' index.html
          test -f gama-supabase.js
          test -f gama-central-sync.js
          test -f gama-excel-import.js
          test -f gama-excel-module-loader.js
          test -f gama-purchases-v14.js
          test -f gama-proveedores-matriz.js
          node --check gama-supabase.js
          node --check gama-central-sync.js
          node --check gama-excel-import.js
          node --check gama-excel-module-loader.js
          node --check gama-purchases-v14.js
          node --check gama-proveedores-matriz.js
      - name: Integrate core modules without replacing index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          modules={
            'gama-supabase':'<script src="gama-supabase.js?v=13"></script>',
            'gama-central-sync':'<script src="gama-central-sync.js?v=1"></script>',
            'gama-excel-import':'<script src="gama-excel-import.js?v=4"></script>',
            'gama-excel-module-loader':'<script src="gama-excel-module-loader.js?v=5"></script>',
            'gama-purchases-v14':'<script src="gama-purchases-v14.js?v=20260827-6"></script>',
            'gama-proveedores-matriz':'<script src="gama-proveedores-matriz.js?v=2"></script>',
          }
          for name in modules:
            s=re.sub(r'\n?<script src="'+re.escape(name)+r'\.js[^\"]*"></script>', '', s)
          tag='\n'.join(modules.values())+'\n'
          if '</body>' not in s: raise SystemExit('Invalid index.html: missing </body>')
          s=s.replace('</body>',tag+'</body>',1)

          # Force a permanent visible entry in the main navigation. The purchases
          # module also injects its own tab, but this fallback makes the feature
          # visible even if the dynamic module initialization is delayed.
          tab='''<button type="button" class="tab" id="gamaPurchasesStaticTab" onclick="window.gamaShowPurchases ? window.gamaShowPurchases() : alert(\'Le module Achats est encore en cours de chargement. Rechargez la page.\')">🛒<span>Achats</span></button>'''
          if 'id="gamaPurchasesStaticTab"' not in s:
            m=re.search(r'<div class="tabs"[^>]*>',s)
            if not m: raise SystemExit('Invalid index.html: .tabs container missing')
            pos=m.end()
            s=s[:pos]+'\n'+tab+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate final integration
        run: |
          test "$(grep -o 'gama-supabase.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-central-sync.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-excel-import.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-excel-module-loader.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-purchases-v14.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-proveedores-matriz.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"gamaPurchasesStaticTab\"' index.html | wc -l)" -eq 1
          grep -q 'gama-purchases-v14.js?v=20260827-6' index.html
          grep -q 'gamaPurchasesStaticTab' index.html
          grep -q 'id="pBarcode"' index.html
      - name: Commit only the integration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: expose purchases module in main navigation'
          git push origin HEAD:main