name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          test -f gama-ui.js
          test -f gama-modules.js
          test -f gama-standard-ui.js
          test -f gama-menu-final2.js
          test -f gama-tms-module.js
          test -f gama-role-spanish.js
          node --check gama-ui.js
          node --check gama-modules.js
          node --check gama-hr.js
          node --check gama-settings.js
          node --check gama-standard-ui.js
          node --check gama-menu-final2.js
          node --check gama-tms-module.js
          node --check gama-role-spanish.js
      - name: Bump modular UI loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'gama-standard-ui\.js\?v=[^"\']+', 'gama-standard-ui.js?v=10', s)
          s=re.sub(r'gama-menu-final2\.js\?v=[^"\']+', 'gama-menu-final2.js?v=10', s)
          p.write_text(s,encoding='utf-8')
          PY
      # The old "Remove duplicate TMS menu entries" step lived here. It patched
      # two things that no longer exist: a TMS tile in gama-menu-final2.js
      # (removed long ago, so its sed was a no-op) and a MODULES_DISABLED split
      # in gama-standard-ui.js. That second sed actively fought the codebase —
      # it re-injected on every push to main the dead array the source tree had
      # deliberately dropped. The source is now the single point of truth for
      # the menu; CI only validates it.
      - name: Validate modular integration
        run: |
          grep -q 'gama-ui.js' index.html
          grep -q 'gama-modules.js' index.html
          grep -q 'gama-standard-ui.js?v=10' index.html
          grep -q 'gama-menu-final2.js?v=10' index.html
          # gama-role-spanish.js is the one live TMS loader: it is the only file
          # that references gama-tms-module.js. Assert against it, not against a
          # loader that has been deleted.
          grep -q 'gama-tms-module.js' gama-role-spanish.js
          grep -q 'gamaTMS' gama-tms-module.js
          # Exactly one loader — guards against a competing loader creeping back.
          test "$(grep -l 'gama-tms-module\.js' *.js | wc -l)" = 1
          node --check gama-standard-ui.js
          node --check gama-menu-final2.js
      - name: Commit deployment references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: bump modular UI loader versions'
          git push origin HEAD:main
