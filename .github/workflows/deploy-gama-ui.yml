name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          test -f gama-standard-ui.js
          test -f gama-purchases-v14.js
          test -f gama-suppliers-cloud-bridge.js
          node --check gama-standard-ui.js
          node --check gama-purchases-v14.js
          node --check gama-suppliers-cloud-bridge.js
      - name: Integrate current modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          modules={
            'gama-supabase':'<script src="gama-supabase.js?v=13"></script>',
            'gama-central-sync':'<script src="gama-central-sync.js?v=1"></script>',
            'gama-excel-import':'<script src="gama-excel-import.js?v=4"></script>',
            'gama-excel-module-loader':'<script src="gama-excel-module-loader.js?v=5"></script>',
            'gama-purchases-v14':'<script src="gama-purchases-v14.js?v=20260827-11"></script>',
            'gama-proveedores-matriz':'<script src="gama-proveedores-matriz.js?v=2"></script>',
            'gama-suppliers-cloud-bridge':'<script src="gama-suppliers-cloud-bridge.js?v=1"></script>',
            'gama-standard-ui':'<script src="gama-standard-ui.js?v=8"></script>',
          }
          for name in modules:
            s=re.sub(r'\n?<script src="'+re.escape(name)+r'\.js[^\"]*"></script>', '', s)
          s=s.replace('</body>','\n'.join(modules.values())+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Restore native form controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* GAMA NATIVE CONTROLS V2 */'
          block='''<style id="gamaNativeControlsV2">
/* GAMA NATIVE CONTROLS V2 */
select,select option{appearance:auto!important;-webkit-appearance:auto!important}
select{position:static!important;z-index:auto!important;pointer-events:auto!important;touch-action:auto!important;transform:none!important;filter:none!important}
select:focus{outline:auto!important}
.gamaStdHeader,.gamaStdHeader *{pointer-events:auto}
</style>'''
          if marker not in s:
            s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          grep -q 'gama-standard-ui.js?v=8' index.html
          grep -q 'gama-purchases-v14.js?v=20260827-11' index.html
          grep -q 'gama-suppliers-cloud-bridge.js?v=1' index.html
          grep -q 'GAMA NATIVE CONTROLS V2' index.html
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: migrate legacy suppliers to cloud'
          git push origin HEAD:main
