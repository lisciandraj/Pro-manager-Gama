name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          test -f gama-standard-ui.js
          test -f gama-menu-final2.js
          test -f gama-tms-module.js
          test -f gama-role-spanish.js
          node --check gama-standard-ui.js
          node --check gama-menu-final2.js
          node --check gama-tms-module.js
          node --check gama-role-spanish.js
      - name: Bump modular UI loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'gama-standard-ui\.js\?v=[^"\']+', 'gama-standard-ui.js?v=9', s)
          s=re.sub(r'gama-menu-final2\.js\?v=[^"\']+', 'gama-menu-final2.js?v=6', s)
          s=re.sub(r'gama-role-spanish\.js\?v=[^"\']+', 'gama-role-spanish.js?v=2', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate modular integration
        run: |
          grep -q 'gama-standard-ui.js?v=9' index.html
          grep -q 'gama-menu-final2.js?v=6' index.html
          grep -q 'gama-role-spanish.js?v=2' index.html
          grep -q 'gama-tms-module.js' gama-standard-ui.js
          grep -q "label:'Entregas / TMS'" gama-standard-ui.js
          grep -q 'gamaTMS' gama-tms-module.js
      - name: Commit deployment references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh modular UI loader cache'
          git push origin HEAD:main
