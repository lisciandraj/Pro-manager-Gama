name: Validate Architect release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: architect-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run verify:migrations
      - run: npm run test:unit
      - run: npm run build
      - name: Verify generated release is current
        run: git diff --exit-code -- index.html architect-core.js architect-components.css architect-assets.js architect-base.css
      - uses: actions/upload-artifact@v4
        with:
          name: architect-static-release
          path: dist/
          include-hidden-files: true
  shared-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/standardization.spec.js tests/loading-performance.spec.js tests/reference-formats.spec.js tests/table-views.spec.js tests/suppliers-directory.spec.js tests/table-cards.spec.js tests/pagination.spec.js tests/auth-single-source.spec.js tests/module-header.spec.js tests/service-documents.spec.js tests/dashboard-analysis.spec.js --workers=2
