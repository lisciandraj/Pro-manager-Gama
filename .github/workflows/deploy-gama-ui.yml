name: Deploy GAMA UI safely
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gama-single-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          test -s index.html
          grep -q '<!doctype html>' index.html
          test -f gama-standard-ui.js
          test -f gama-menu-final2.js
          test -f gama-tms-module.js
          test -f gama-client-modules.js
          node --check gama-standard-ui.js
          node --check gama-menu-final2.js
          node --check gama-tms-module.js
          node --check gama-client-modules.js
      - name: Bump modular UI loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'gama-standard-ui\.js\?v=[^"\']+', 'gama-standard-ui.js?v=8', s)
          s=re.sub(r'gama-menu-final2\.js\?v=[^"\']+', 'gama-menu-final2.js?v=7', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove duplicate TMS menu entries
        run: |
          sed -i "/Entregas \/ TMS.*gamaTMS.*truck/d" gama-menu-final2.js
          sed -i "s/const MODULES=\[/const MODULES=[];const MODULES_DISABLED=[/" gama-standard-ui.js
      - name: Validate modular integration
        run: |
          grep -q 'gama-standard-ui.js?v=8' index.html
          grep -q 'gama-menu-final2.js?v=7' index.html
          grep -q 'gama-tms-module.js' gama-standard-ui.js
          grep -q 'gamaTMS' gama-tms-module.js
          grep -q 'gama-client-modules.js' gama-menu-final2.js
          node --check gama-standard-ui.js
          node --check gama-menu-final2.js
      - name: Commit deployment references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gama-menu-final2.js gama-standard-ui.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore complete DEV module menu'
          git push origin HEAD:main
