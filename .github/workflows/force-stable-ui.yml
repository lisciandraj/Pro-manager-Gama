name: Install definitive GAMA UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final UI helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['gama-v10-stable','gama-menu-final','gama-menu-clean','gama-menu-final2','gama-scanner-phone','gama-product-scanner']:
              s=re.sub(r'\n?<script src="'+name+r'\.js[^\"]*"></script>', '', s)
          s=re.sub(r'\n?<script>.*?gamaScannerV4Style.*?</script>', '', s, flags=re.S)
          old='<div><label>Código de barras *</label><input id="pBarcode"></div>'
          new='<div class="scanner"><input id="pBarcode" placeholder="Código de barras"><button type="button" class="gamaPhoneScanBtn" onclick="event.preventDefault();event.stopPropagation();window.startGamaScan(\'pBarcode\')">📷 Escanear</button></div>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="pBarcode"' not in s:
              raise SystemExit('pBarcode field missing')
          s=s.replace('gama-scanner-phone.js?v=8','gama-scanner-phone.js?v=9')
          tag='<script src="gama-menu-final2.js?v=3"></script>\n<script src="gama-scanner-phone.js?v=9"></script>\n<script src="gama-product-scanner.js?v=2"></script>\n'
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate product scanner
        run: |
          grep -q 'id="pBarcode" placeholder="Código de barras"' index.html
          grep -q "window.startGamaScan('pBarcode')" index.html
          grep -q 'gama-scanner-phone.js?v=9' index.html
          grep -q 'gama-product-scanner.js?v=2' index.html
          ! grep -q 'gamaScannerV4Style' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix product barcode scanner field integration'
          git push
