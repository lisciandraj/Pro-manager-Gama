name: Verify GAMA production publication
on:
  push:
    branches: [build/gama-compliance-publication-20261029]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3118c561d5a232a61909cf26c2b07bc66357c99b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify served revisions and reject unauthenticated submissions before database writes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const erp='https://lisciandraj.github.io/Pro-manager-Gama/',site='https://gama-coco.pages.dev',expected='3118c561d5a232a61909cf26c2b07bc66357c99b';
          const read=async(url)=>{const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200,url);return r;};
          const marker=await(await read(erp+'coco-build.json?verification='+expected)).json();assert.equal(marker.commit,expected,'served ERP commit');
          const html=await(await read(erp+'?verification='+expected)).text();
          const assetPath=html.match(/src=["']([^"']*architect-assets\.js[^"']*)["']/)?.[1];assert.ok(assetPath,'ERP asset manifest');
          const assets=await(await read(new URL(assetPath,erp))).text();assert.ok(assets.includes('gama-compliance-admin.js'),'compliance module in manifest');
          const admin=await(await read(erp+'gama-compliance-admin.js?verification='+expected)).text();assert.equal(admin,fs.readFileSync('gama-compliance-admin.js','utf8'),'ERP compliance asset');
          const website=await(await read(site+'/?verification='+expected)).text();assert.ok(website.includes('commerce.js'));
          for(const name of ['commerce.js','commerce.css','b2b.js','site.js'])assert.equal(await(await read(site+'/'+name+'?verification='+expected)).text(),fs.readFileSync('src/storefront/'+name,'utf8'),name);
          async function rpc(action,data={},origin=site){return fetch(site+'/api/storefront',{method:'POST',headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify({p_action:action,p_data:data}),signal:AbortSignal.timeout(20000)});}
          const b=await rpc('bootstrap');assert.equal(b.status,200);const boot=await b.json();assert.match(boot.policies.version,/^2026-10-29\.2-[a-f0-9]{32}$/);assert.equal(Object.keys(boot.policies.documents).length,5);assert.equal(boot.commerce.turnstile_sitekey,'0x4AAAAAAFrrJNRSG1ZuTRCE');assert.equal(boot.commerce.payment_enabled,false);
          const policies=await rpc('commerce_policies');assert.equal(policies.status,200);const p=await policies.json();assert.equal(p.version,boot.policies.version);assert.equal(p.commerce.turnstile_sitekey,boot.commerce.turnstile_sitekey);
          const denied=await rpc('commerce_case_submit');assert.equal(denied.status,400);assert.equal((await denied.json()).error,'HUMAN_VERIFICATION_REQUIRED');
          const originDenied=await rpc('commerce_case_submit',{},'https://untrusted.invalid');assert.equal(originDenied.status,403);assert.equal((await originDenied.json()).error,'WEBSITE_INVALID_ORIGIN');
          console.log(JSON.stringify({erp_commit:marker.commit,erp_compliance_asset:true,website_assets_match_source:true,policy_version:p.version,human_verification_required:true,foreign_origin_rejected:true,payment_enabled:false,business_records_created:0}));
          
          NODE
