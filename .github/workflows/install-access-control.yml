name: Install GAMA access control
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate access control module
        run: node --check gama-access-control.js
      - name: Validate fixed header module
        run: node --check gama-fixed-header.js
      - name: Integrate access control and fixed header into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="gama-access-control\.js[^\"]*"></script>', '', s)
          s=re.sub(r'\n?<script src="gama-fixed-header\.js[^\"]*"></script>', '', s)
          tag='<script src="gama-access-control.js?v=1"></script>\n<script src="gama-fixed-header.js?v=1"></script>\n'
          if '</body>' not in s:
              raise SystemExit('index.html inválido: falta </body>')
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          test "$(grep -o 'gama-access-control.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'gama-fixed-header.js' index.html | wc -l)" -eq 1
          grep -q 'gama-access-control.js?v=1' index.html
          grep -q 'gama-fixed-header.js?v=1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate fixed header actions'
          git pull --rebase origin main
          git push
