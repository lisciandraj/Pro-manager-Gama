name: Install GAMA Excel Import
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Excel module and UI loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['gama-excel-import','gama-excel-import-v1','gama-excel-module-loader']:
              s=re.sub(r'\n?<script src="'+name+r'\.js[^\"]*"></script>', '', s)
          tag='<script src="gama-excel-import.js?v=2"></script>\n<script src="gama-excel-module-loader.js?v=14"></script>\n'
          if '</body>' not in s: raise SystemExit('index.html invalid')
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check gama-excel-import.js
          node --check gama-excel-module-loader.js
          node --check gama-purchases-v14.js
          grep -q 'gama-excel-import.js?v=2' index.html
          grep -q 'gama-excel-module-loader.js?v=14' index.html
          grep -q 'gama-purchases-v14.js' gama-excel-module-loader.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire Excel import and purchases v14 into GAMA UI'
          git push
