name: Install GAMA fixed header
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed header script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="gama-fixed-header\.js[^\"]*"></script>', '', s)
          tag='<script src="gama-fixed-header.js?v=1"></script>\n'
          if '</body>' not in s:
              raise SystemExit('body tag missing')
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'gama-fixed-header.js?v=1' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: install fixed header actions'
          git pull --rebase origin main
          git push
