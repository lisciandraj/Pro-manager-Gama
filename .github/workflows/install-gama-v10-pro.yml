name: Install GAMA V10 Pro UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject UI scripts into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="gama-v10-pro.js?v=10.3"></script>','<script src="gama-v10-language.js?v=10.3"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          print('language script:', 'gama-v10-language.js' in s)
          print('pro script:', 'gama-v10-pro.js' in s)
          PY
      - name: Validate and commit
        run: |
          grep -q 'gama-v10-pro.js?v=10.3' index.html
          grep -q 'gama-v10-language.js?v=10.3' index.html
          grep -q 'gama-pro-direct' gama-v10-pro.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'UI already installed'; else git commit -m 'Install V10.3 language selector directly in app'; git push; fi
