name: Install reliable GAMA header logo v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject inline logo script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="gama-logo-header-fix-v2.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          if sw.exists():
              x=sw.read_text(encoding='utf-8')
              x=x.replace('gama-stock-v10-2','gama-stock-v10-3').replace('gama-stock-v10-pro','gama-stock-v10-3')
              sw.write_text(x,encoding='utf-8')
          PY
          grep -q 'gama-logo-header-fix-v2.js?v=2' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then echo 'Already installed'; else git commit -m 'Install reliable inline GAMA header logo'; git push; fi
