name: Install GAMA phone scanner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scanner and clean inactive back link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="gama-scanner-phone\.js[^\"]*"></script>', '', s)
          tag='<script src="gama-scanner-phone.js?v=1"></script>'
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: grep -q 'gama-scanner-phone.js?v=1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable phone barcode scanner'
          git push
