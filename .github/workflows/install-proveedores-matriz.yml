name: Install Proveedores y Matriz
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider JavaScript des modules
        run: node --check gama-proveedores-matriz.js
      - name: Integrar módulos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="gama-proveedores-matriz\.js[^"]*"></script>', '', s)
          tag='<script src="gama-proveedores-matriz.js?v=2"></script>\n'
          if '</body>' not in s:
              raise SystemExit('index.html inválido: falta </body>')
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar integración
        run: |
          test "$(grep -o 'gama-proveedores-matriz.js' index.html | wc -l)" -eq 1
          grep -q 'gama-proveedores-matriz.js?v=2' index.html
          grep -q 'id="pBarcode"' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate and install suppliers matrix modules'
          git push
