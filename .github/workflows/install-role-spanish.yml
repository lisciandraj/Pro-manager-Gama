name: Install Spanish role labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate role translation script
        run: node --check gama-role-spanish.js
      - name: Install role translation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="gama-role-spanish\.js[^"]*"></script>', '', s)
          tag='<script src="gama-role-spanish.js?v=1"></script>\n'
          if '</body>' not in s: raise SystemExit('Missing </body>')
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          test "$(grep -o 'gama-role-spanish.js' index.html | wc -l)" -eq 1
          grep -q 'gama-role-spanish.js?v=1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install Spanish access role labels'
          git push
