name: Coco architecture audit
on:
  push:
    branches: [refactor/coco-maintenance]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/runtime-assets.json'
      - 'tests/**'
      - '.github/workflows/refactor-audit.yml'
permissions:
  contents: read
concurrency:
  group: coco-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/refactor/coco-maintenance' && !startsWith(github.event.head_commit.message, 'build: refresh Coco generated assets')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/coco-maintenance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Commit generated assets on this maintenance branch
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {generated}=require('./scripts/lib/assets.cjs');
          const files=[...generated,'index.html','gama-site.html','camera-check.html','architect-core.js','architect-components.css','architect-base.css','architect-assets.js','sw.js'];
          execFileSync('git',['add','--',...files]);
          if(!execFileSync('git',['diff','--cached','--name-only']).toString().trim())process.exit(0);
          execFileSync('git',['-c','user.name=Coco build','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','build: refresh Coco generated assets']);
          execFileSync('git',['push','origin','HEAD:refactor/coco-maintenance']);
          NODE
  audit:
    needs: generate
    if: always() && (needs.generate.result == 'success' || needs.generate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'refactor/coco-maintenance' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run check:generated
      - run: npm run test:architecture
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lazy-workspaces.spec.js tests/loading-performance.spec.js tests/performance-guard.spec.js tests/security-boundaries.spec.js tests/scanner-integration.spec.js tests/knowledge.spec.js tests/assistant-ia.spec.js tests/tms-module.spec.js tests/tms-loading.spec.js tests/project-management.spec.js tests/stock-adjustments.spec.js tests/excel-import.spec.js tests/i18n-coverage.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coco-audit-traces
          path: test-results/
