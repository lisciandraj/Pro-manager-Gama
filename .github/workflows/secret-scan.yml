name: Scan secrets
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the pinned secret scanner archive
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 2 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_ARCHIVE_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Verify scanner and reviewed allowlist with non-live canaries
        run: python3 scripts/check-secret-scanner.py "$RUNNER_TEMP/gitleaks"
      - name: Scan all available Git history without retaining secret material
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts=--all .'
