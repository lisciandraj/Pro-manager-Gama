name: SRI integration verification
on:
  push:
    branches: [feat/openapi-sri-integration]
    paths: [.github/workflows/sri-integration-snapshot.yml]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openapi-sri-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          pieces = [pathlib.Path(f'.github/coco-sri-payload/part{i}.txt').read_text().strip() for i in range(1,5)]
          patch = lzma.decompress(base64.b64decode(''.join(pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '322f7636c968dc41987e4e9d1abc40570f2f565a4485cd6bfb009b875adb6e12'
          pathlib.Path('/tmp/coco-sri-source.patch').write_bytes(patch)
          PY
          git apply --check /tmp/coco-sri-source.patch
          git apply /tmp/coco-sri-source.patch
      - run: npm ci --ignore-scripts
      - run: pip install requests==2.32.5
      - name: Build canonical sources
        run: npm run build
      - name: Static release checks
        run: |
          set -o pipefail
          (npm run check && npm run typecheck && npm run check:docs && npm run check:generated && npm run check:startup && npm run verify:migrations) 2>&1 | tee /tmp/sri-static.log
      - name: Commit source and generated assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src services tests docs locales supabase/functions
          git commit -m 'feat(sri): integrate Open API provider, standalone module and invoice cross-links'
          git push origin HEAD:feat/openapi-sri-integration
      - name: Connector and edge contract tests
        run: |
          set -o pipefail
          (python3 -m unittest discover -s tests -p 'test_sri*.py' -v && node --test tests/sri-openapi-edge.test.cjs) 2>&1 | tee /tmp/sri-contracts.log
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser integration and regressions
        run: |
          set -o pipefail
          npx playwright test tests/sri-integration.spec.js tests/accounting.spec.js tests/internal-invoices.spec.js tests/payments.spec.js --workers=2 2>&1 | tee /tmp/sri-browser.log
      - name: Unit regression suite
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/sri-unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sri-verification-results
          path: |
            /tmp/sri-*.log
            test-results/
          retention-days: 3
