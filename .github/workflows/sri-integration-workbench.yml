name: SRI integration workbench
on:
  push:
    branches: [feature/coco-openapi-sri]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=coco-source.zip HEAD
      - uses: actions/checkout@v4
        with:
          repository: AngeloBarzolaVillamar/open-api-facturacion-sri
          ref: b41a7c79ba3fb2f0977efd3065bc126e1d9651ac
          path: upstream
          persist-credentials: false
      - run: git -C upstream archive --format=zip --output=../upstream-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: coco-sri-source
          path: |
            coco-source.zip
            upstream-source.zip
          retention-days: 1
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar -czf /tmp/coco-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: coco-sri-test-dependencies
          path: /tmp/coco-node-modules.tar.gz
          retention-days: 1
      - run: npm run build
      - run: npm run validate
      - run: git diff --binary > generated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coco-sri-generated
          path: generated.patch
          retention-days: 1
