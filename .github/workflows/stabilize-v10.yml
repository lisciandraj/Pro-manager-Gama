name: Stabilize GAMA V10
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate UI layers and external preload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('gama-v10-pro.js','gama-v10-language.js','gama-logo-header-fix.js','gama-logo-header-fix-v2.js'):
              s=re.sub(r'\n?<script src="'+re.escape(name)+r'(?:\?[^\"]*)?"></script>', '', s)
          s=s.replace('<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>','')
          if '<script src="gama-v10-language.js?v=stable"></script>' not in s:
              s=s.replace('</body>','<script src="gama-v10-language.js?v=stable"></script>\n<script src="gama-v10-stable.js?v=1"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove expensive language MutationObserver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gama-v10-language.js')
          s=p.read_text(encoding='utf-8')
          marker='let timer;new MutationObserver'
          if marker in s:
              s=s.split(marker,1)[0]+'})();\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Make scanner lazy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async function scan(target){let v=$('camera');"
          new="async function scan(target){await window.loadZXing();let v=$('camera');"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'gama-v10-stable.js?v=1' index.html
          grep -q 'gama-v10-language.js?v=stable' index.html
          ! grep -q 'gama-v10-pro.js' index.html
          ! grep -q 'gama-logo-header-fix' index.html
          ! grep -q 'https://unpkg.com/@zxing/browser@0.2.1' index.html
          grep -q 'await window.loadZXing()' index.html
          node --check gama-v10-stable.js
          node --check sw.js
      - name: Commit stabilization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gama-v10-language.js
          if git diff --cached --quiet; then echo 'Already stable'; else git commit -m 'Stabilize V10 and remove duplicate scripts'; git push; fi
