name: Verify GAMA storefront interface
on:
  pull_request:
    paths:
      - 'src/storefront/**'
      - 'scripts/build-storefront.cjs'
      - 'tests/storefront.spec.js'
      - 'tests/b2b-portal.spec.js'
      - '.github/workflows/storefront-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-interface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:storefront
      - run: node --test tests/storefront-server.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify public and connected catalogue at phone, tablet and desktop sizes
        run: npx playwright test tests/storefront.spec.js tests/b2b-portal.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gama-storefront-interface
          path: test-results/
          retention-days: 3
