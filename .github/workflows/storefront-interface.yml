name: Verify GAMA storefront interface
on:
  pull_request:
    paths:
      - 'src/storefront/**'
      - 'scripts/build-storefront.cjs'
      - 'tests/storefront.spec.js'
      - 'tests/commerce-workflows-db.test.cjs'
      - 'supabase/migrations/*gama_ecommerce_workflows.sql'
      - 'tests/b2b-portal.spec.js'
      - 'tests/storefront-progressive.test.cjs'
      - 'tests/storefront-projection-db.test.cjs'
      - 'tests/storefront-bootstrap-db.test.cjs'
      - 'supabase/migrations/*storefront_bootstrap*.sql'
      - 'tests/helpers/storefront-proposal.cjs'
      - 'docs/audits/proposals/coco-storefront-projection*.sql'
      - '.github/workflows/storefront-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-interface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:storefront
      - run: node --test tests/storefront-server.test.mjs
      - run: node --test tests/commerce-workflows-db.test.cjs
      - name: Verify the audit proposal with isolated public and B2B fixtures
        run: |
          node --test tests/storefront-progressive.test.cjs tests/storefront-projection-db.test.cjs tests/storefront-bootstrap-db.test.cjs
          node --require ./tests/helpers/storefront-proposal.cjs --test --test-concurrency=2 tests/storefront-db.test.cjs tests/b2b-storefront-db.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify public and connected catalogue at phone, tablet and desktop sizes
        run: npx playwright test tests/storefront.spec.js tests/b2b-portal.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gama-storefront-interface
          path: test-results/
          retention-days: 3
