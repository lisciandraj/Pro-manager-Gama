name: Test Agent Coco (read only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/prepare-agent-coco.cjs
      - run: npm run build
      - run: node --test tests/coco-agent-mcp.test.mjs tests/coco-agent-db.test.cjs tests/coco-agent-planner.test.mjs
      - run: npm run check && npm run typecheck && npm run check:generated && npm run check:startup
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/coco-agent-ui.spec.js tests/assistant-ia.spec.js --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coco-agent-interface-results
          path: test-results/
          retention-days: 3
      - name: Package reviewed build workspace (no credentials or remote access)
        run: |
          git diff --stat
          tar --exclude='./.git' --exclude='./.env*' --exclude='./.npmrc' --exclude='./supabase/.temp' --exclude='./test-results' --exclude='./playwright-report' -czf "$RUNNER_TEMP/coco-agent-workspace.tgz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coco-agent-reviewed-build
          path: ${{ runner.temp }}/coco-agent-workspace.tgz
          retention-days: 3
