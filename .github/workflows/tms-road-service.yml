name: Validate private TMS road service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/tms-routing/**
      - scripts/check-tms-road-service.mjs
      - tests/tms-road-service*
      - supabase/functions/tms-routing/**
      - supabase/functions/_shared/http.mjs
      - .github/workflows/tms-road-service.yml
  pull_request:
    paths:
      - services/tms-routing/**
      - scripts/check-tms-road-service.mjs
      - tests/tms-road-service*
      - supabase/functions/tms-routing/**
      - supabase/functions/_shared/http.mjs
      - .github/workflows/tms-road-service.yml
permissions:
  contents: read
concurrency:
  group: tms-road-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  isolated-osrm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify readiness boundaries and preservation of an existing configuration
        run: node --test tests/tms-road-service.test.mjs
      - name: Verify actual pinned OSRM, authentication, private network and 20/50/100 matrices
        run: python tests/tms-road-service-integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tms-road-service-verification-${{ matrix.runner }}
          path: test-results/tms-road-service.json
          if-no-files-found: error
          retention-days: 14
