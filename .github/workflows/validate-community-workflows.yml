name: Validate Community sales and accounting flows
on:
  pull_request:
  push:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: community-flows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify implemented Community workflows in French, English and Spanish
        run: npx playwright test tests/sales-commercial.spec.js tests/sales-rewards.spec.js tests/direct-invoices.spec.js tests/direct-paid-refunds.spec.js tests/accounting-early-discounts.spec.js tests/advanced-tax-engine.spec.js tests/accounting-product-accounts.spec.js tests/quote-documents.spec.js tests/sales-checkout.spec.js tests/checkout-payments.spec.js tests/invoice-tools.spec.js --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: community-sales-accounting-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
