name: Validate Contacts dossier
on:
  pull_request:
  push:
    branches: [main, feature/contacts-hub-2026-10-15, feature/contacts-alignment-20261016]
permissions:
  contents: read
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify applied migration integrity and contact transactions
        run: npm run verify:migrations && node --test tests/contact-alignment.test.cjs tests/contact-single-name.test.cjs tests/contact-odoo-fields.test.cjs tests/contact-nature-company.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify contact dossier browser workflows
        run: npx playwright test tests/contacts.spec.js tests/contact-alignment-ui.spec.js tests/contact-single-name.spec.js tests/crm-contacts.spec.js tests/global-search.spec.js tests/contact-odoo-fields.spec.js tests/contact-nature-company.spec.js --workers=2 --reporter=json > contacts-browser.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contacts-browser-diagnostics
          path: |
            contacts-browser.json
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/contact-hub-mobile.png
          retention-days: 7
