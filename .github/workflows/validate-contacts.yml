name: Validate Contacts dossier
on:
  push:
    branches: [main, feature/contacts-hub-2026-10-15]
permissions:
  contents: read
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify contact dossier browser workflows
        run: npx playwright test tests/contacts.spec.js --workers=2 --reporter=json > contacts-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contacts-browser-diagnostics
          path: |
            contacts-browser.json
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/contact-hub-mobile.png
          retention-days: 7
