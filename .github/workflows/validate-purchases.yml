name: Validate Coco purchases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check gama-purchases-v14.js
      - name: Validate integration references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const checks = {
            'src/app/lazy-modules.js': ['gama-purchases-v14.js'],
            'config/runtime-assets.json': ['src/features/purchasing/workspace.js'],
            'gama-purchases-v14.js': ['gamaShowPurchases', 'gama_receive_purchase', 'purchase_orders', 'purchase_order_lines'],
          };
          for (const [path, references] of Object.entries(checks)) {
            const content = fs.readFileSync(path, 'utf8');
            for (const reference of references) assert.ok(content.includes(reference), `${path}: missing ${reference}`);
          }
          NODE
