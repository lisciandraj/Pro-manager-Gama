name: Validate Coco purchases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check gama-purchases-v14.js
      - name: Validate integration references
        run: |
          rg -q 'gama-purchases-v14.js' src/app/lazy-modules.js
          rg -q 'src/features/purchasing/workspace.js' config/runtime-assets.json
          rg -q 'gamaShowPurchases' gama-purchases-v14.js
          rg -q 'gama_receive_purchase' gama-purchases-v14.js
          rg -q 'purchase_orders' gama-purchases-v14.js
          rg -q 'purchase_order_lines' gama-purchases-v14.js
