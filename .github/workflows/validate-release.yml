name: Validate Coco release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: architect-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stock-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coco_concurrency
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-stock-concurrency.cjs
        env:
          STOCK_TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/coco_concurrency
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.0.1
      - run: npm ci
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: coco-static-release
          path: dist/
          include-hidden-files: true
  shared-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:storefront
      - run: npx playwright test tests/storefront.spec.js tests/b2b-portal.spec.js tests/manual-mail-waze.spec.js tests/sri-integration.spec.js tests/dossier-flow.spec.js tests/accounting.spec.js tests/fulfillment.spec.js tests/quote-adjust.spec.js tests/select-search.spec.js tests/product-identity.spec.js tests/inventory-quants.spec.js tests/inventory-count.spec.js tests/inventory.spec.js tests/stock-workspace.spec.js tests/audit-controls.spec.js tests/audit-trail.spec.js tests/assistant-ia.spec.js tests/standardization.spec.js tests/loading-performance.spec.js tests/pdf-on-demand.spec.js tests/reference-formats.spec.js tests/table-controls.spec.js tests/table-views.spec.js tests/suppliers-directory.spec.js tests/table-cards.spec.js tests/pagination.spec.js tests/auth-single-source.spec.js tests/cloud-customer-accounts.spec.js tests/module-header.spec.js tests/service-documents.spec.js tests/returns.spec.js tests/website-preview.spec.js tests/surveys.spec.js tests/contacts.spec.js tests/collections.spec.js tests/crm-contacts.spec.js tests/dashboard-analysis.spec.js tests/employee-photos.spec.js --workers=2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gama-storefront-layout
          path: |
            test-results/public-storefront-*.png
            test-results/gama-b2b-*.png
            test-results/gama-*.png
          if-no-files-found: ignore
          retention-days: 7

  stock-adjustments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/stock-adjustments.spec.js tests/select-search.spec.js --workers=2

  sri-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 lxml==6.0.1 reportlab==4.4.3 pypdf==6.10.0
      - run: python -m unittest discover -s tests -p 'test_sri*.py' -v
