name: Validate sales concurrency
on:
  pull_request:
  push:
    branches: [main, feature/sales-dossier-2026-10-15]
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: coco_test_sales
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/sales-concurrency.test.cjs
        env:
          COCO_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/coco_test_sales
