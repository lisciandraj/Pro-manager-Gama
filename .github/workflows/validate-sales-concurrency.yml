name: Validate sales concurrency
on:
  pull_request:
  push:
    branches: [main, feature/sales-dossier-2026-10-15]
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: coco_test_sales
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/sales-concurrency.test.cjs
        env:
          COCO_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/coco_test_sales
