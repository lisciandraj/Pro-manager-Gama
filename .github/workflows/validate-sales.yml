name: Validate sales workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build canonical sources and verify deterministic generated assets
        run: npm run build && npm run check:generated
      - run: node --test tests/sales-workspace-db.test.cjs
      - run: node --test tests/global-search-core.test.cjs
      - run: node --test tests/project-management-core.test.cjs tests/project-management-db.test.cjs
      - run: node --check gama-projects.js
      - run: node --check gama-i18n.js
      - run: node --check gama-i18n-catalog.js
      - run: node --check gama-hr.js
      - run: node --check gama-hr-p1.js
      - run: node --check gama-payments.js
      - run: node --check gama-operations.js
      - run: node --check gama-fulfillment.js
      - run: node --check gama-dossier-flow.js
      - run: node --check gama-references.js
      - run: node --check gama-sales.js
      - run: node --check gama-customer-requests.js
      - run: node --check gama-quotes.js
      - run: node --check gama-quote-pdf.js
      - run: node --check gama-tms-loading.js
      - run: node --check gama-tms-module.js
      - run: npx playwright test tests/project-management.spec.js tests/global-search.spec.js tests/request-quote.spec.js tests/payments.spec.js tests/dossier-references.spec.js tests/dossier-flow.spec.js tests/hr-p1.spec.js tests/modules-hr.spec.js tests/i18n.spec.js tests/internal-invoices.spec.js tests/dashboard-analysis.spec.js tests/scanner-integration.spec.js tests/scanner-camera.spec.js tests/operations.spec.js tests/fulfillment.spec.js tests/sales-orders.spec.js tests/order-followup.spec.js tests/purchase-order-email.spec.js tests/sales-module-tabs.spec.js tests/sales-dossier.spec.js tests/quote-adjust.spec.js tests/sales-workspace.spec.js tests/tms-loading.spec.js tests/tms-module.spec.js tests/client-quotes.spec.js tests/security-boundaries.spec.js tests/users-screen.spec.js tests/invitation-email.spec.js tests/module-header.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-workflow-results
          path: test-results/
          retention-days: 3
  dossier-discussion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build-i18n.py --catalog-only
      - run: npx playwright test tests/order-followup.spec.js tests/order-followup-grouping.spec.js tests/module-history.spec.js tests/purchase-order-email.spec.js --workers=2
      - run: npx playwright test tests/sales-module-tabs.spec.js tests/sales-orders.spec.js tests/tms-module.spec.js --grep "warehouse reaches|standard live search|warehouse role sees|failed detailed-map" --workers=2 --output=test-results/dossier-regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-followup-ui
          path: |
            test-results/followup-*.png
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
