name: Validate sales workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build-i18n.py
      - run: git diff --exit-code
      - run: node --check gama-i18n.js
      - run: node --check gama-i18n-catalog.js
      - run: node --check gama-hr.js
      - run: node --check gama-hr-p1.js
      - run: node --check gama-operations.js
      - run: node --check gama-fulfillment.js
      - run: node --check gama-dossier-flow.js
      - run: node --check gama-references.js
      - run: node --check gama-sales.js
      - run: node --check gama-quotes.js
      - run: node --check gama-quote-pdf.js
      - run: node --check gama-tms-loading.js
      - run: node --check gama-tms-module.js
      - run: npx playwright test tests/dossier-references.spec.js tests/dossier-flow.spec.js tests/hr-p1.spec.js tests/modules-hr.spec.js tests/i18n.spec.js tests/internal-invoices.spec.js tests/dashboard-analysis.spec.js tests/scanner-integration.spec.js tests/scanner-camera.spec.js tests/operations.spec.js tests/fulfillment.spec.js tests/sales-orders.spec.js tests/tms-loading.spec.js tests/tms-module.spec.js tests/client-quotes.spec.js tests/security-boundaries.spec.js tests/module-header.spec.js --workers=2
