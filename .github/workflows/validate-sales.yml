name: Validate sales workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check gama-sales.js
      - run: npx playwright test tests/sales-orders.spec.js tests/security-boundaries.spec.js tests/module-header.spec.js --workers=2
