<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GAMA ERP">
  <!-- Icono de la aplicación en la identidad actual: el teal y el naranja de
       GAMA ERP. El anterior seguía diciendo «STOCK MANAGER V4» en verde y
       azul marino, de la identidad de la que viene la aplicación, así que lo
       instalado en un teléfono no se parecía a lo que se abría dentro.
       El margen de seguridad es generoso a propósito: Android recorta el
       icono en círculo, y por eso el dibujo cabe dentro del 66% central. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8C9C"/>
      <stop offset="1" stop-color="#075C69"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>

  <!-- Caja isométrica: el inventario, que es el corazón del producto. -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-width="16">
    <path d="M256 136 372 200 372 312 256 376 140 312 140 200Z" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF"/>
    <path d="M140 200 256 264 372 200" stroke="#FFFFFF"/>
    <path d="M256 264 256 376" stroke="#FFFFFF"/>
    <!-- La arista superior en naranja: el acento de la marca. -->
    <path d="M256 136 372 200 256 264 140 200Z" fill="#F47A2A" stroke="#F47A2A"/>
  </g>

  <!-- La curva de crecimiento, que es la otra mitad: del almacén al ERP. Va
       entera por debajo de la caja: cruzándola, las dos formas se leían como
       una sola mancha. -->
  <path d="M148 434 212 412 276 424 360 384" fill="none" stroke="#FF8B45" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="360" cy="384" r="15" fill="#FF8B45"/>
</svg>
