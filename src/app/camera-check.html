<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GAMA · Prueba de cámara</title>
<style>body{margin:0;padding:24px;background:#eef3f6;color:#18324a;font:17px system-ui}main{max-width:640px;margin:auto}button,a{font:inherit}button{padding:14px;border:0;border-radius:10px;background:#087c8b;color:white;margin:5px 0;min-height:48px}video{display:block;width:100%;max-height:42vh;background:black;border-radius:14px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border-radius:12px;font-size:13px}.buttons{display:flex;flex-wrap:wrap;gap:10px}#status{font-weight:700}a{color:#087c8b}</style></head>
<body><main><h1>Prueba de cámara GAMA</h1><p>Esta página prueba la cámara sin cargar el ERP ni el lector de códigos. No toma fotos ni envía imágenes.</p><div class="buttons"><button id="default">Probar cámara automática</button><button id="rear">Probar cámara trasera</button><button id="stop">Detener</button></div><video id="video" muted playsinline autoplay></video><p id="status" role="status">Pulsa un botón para iniciar.</p><p>Si no funciona, comparte una captura del resultado de abajo.</p><pre id="report"></pre><a href="./index.html">Volver a GAMA</a></main>
<script>
(()=>{'use strict';const video=document.getElementById('video'),status=document.getElementById('status'),report=document.getElementById('report');let stream=null,version=0;const lines=[];function log(s){lines.push(s);report.textContent=lines.join('\n')}function stop(){version++;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}log('GAMA cámara · diagnóstico 20260912-3');log('HTTPS: '+isSecureContext+' · ventana principal: '+(self===top));log('Modo: '+(navigator.standalone||matchMedia('(display-mode: standalone)').matches?'aplicación instalada':'navegador'));log('Navegador: '+navigator.userAgent);log('API cámara: '+Boolean(navigator.mediaDevices?.getUserMedia));const policy=document.permissionsPolicy||document.featurePolicy;if(policy?.allowsFeature)log('Política cámara: '+policy.allowsFeature('camera'));
async function test(rear){stop();const token=version;status.textContent='Solicitando cámara…';const constraints={audio:false,video:rear?{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}:true};log('\nPrueba: '+(rear?'trasera (igual que ERP)':'automática (sin restricciones)'));log('Gesto activo: '+(navigator.userActivation?.isActive??'no disponible'));let stage='getUserMedia';const started=Date.now();try{const result=await navigator.mediaDevices.getUserMedia(constraints);if(token!==version){result.getTracks().forEach(t=>t.stop());return}stream=result;log('Acceso concedido · '+(Date.now()-started)+' ms');video.muted=true;video.playsInline=true;video.srcObject=stream;stage='video.play';await video.play();if(token!==version)return;status.textContent='Cámara funcionando.';log('Vídeo: '+video.videoWidth+' × '+video.videoHeight+' · pistas: '+stream.getVideoTracks().map(t=>t.readyState).join(', '))}catch(e){if(token!==version)return;stop();status.textContent='Prueba bloqueada en '+stage;log(stage+' → '+e.name+': '+e.message+' · '+(Date.now()-started)+' ms');}}
document.getElementById('default').onclick=()=>test(false);document.getElementById('rear').onclick=()=>test(true);document.getElementById('stop').onclick=()=>{stop();status.textContent='Cámara detenida.'};window.addEventListener('pagehide',stop);
})();
</script></body></html>
