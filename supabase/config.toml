# Local CLI project identity only. Hosted Auth configuration is not changed by this file.
project_id = "coco-erp"

# Public OAuth resource discovery is served without an API key. Every MCP POST
# independently validates the user's Supabase token before any business call.
[functions.coco-agent-mcp]
verify_jwt = false

# Retired mailbox endpoint returns 410 without reading credentials or contacting
# providers. It remains public so old callback links receive the removal notice.
[functions.coco-order-mail]
verify_jwt = false

# Private road-matrix adapter; caller authorization and TMS/MFA checks run before routing.
[functions.tms-routing]
verify_jwt = true

# Single-purpose quote capability. Database checks enforce production-only
# public access; development previews require a caller-bound verified admin.
[functions.coco-checkout]
verify_jwt = false

# Official hosted payments adapter; HMAC verifies webhooks, caller-bound RPCs
# authorize checkout sessions before any privileged service access.
[functions.coco-checkout-payments]
verify_jwt = false
